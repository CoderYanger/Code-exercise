<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 控制p标签元素展示效果 */
        /* p就是这里的选择器 */
        p{
            /* 这里就是对应选择器的声明 */
            /* 字体颜色 */
            color:red;
            /* 字体大小 */
            font-size:40px;
        }
    </style>
</head>
<body>
    <p style="color:green;">hello word</p>
    <p>hello 小比特</p>
    <!-- h1未被修改，还是原始效果 -->
    <h1 style="color:blue; font-size: 80px;">你好</h1>
</body>
</html>
