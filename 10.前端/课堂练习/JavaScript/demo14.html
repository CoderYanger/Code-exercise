<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 表白墙 -->
    <div class="container">
        <h1>表白墙</h1>
        <p>输入相关信息，点击提交，数据将会展示在表格中</p>
        <div class="div1">
            <span>谁：</span><input type="text" class="edit">
        </div>
        <div class="div1">
            <span>对谁：</span><input type="text" class="edit">
        </div>
        <div class="div1">
            <span>说：</span><input type="text" class="edit">
        </div>
        <div class="div1">
            <!-- 绑定点击事件 -->
            <input type="button" value="提交" class="submit" onclick="Submit()">
        </div>
    </div>
</body>
<style>
    *{
        margin:0px;
        padding:0px;
    }
    .container{
        width: 400px;
        /* 将整个布局放到正中间 */
        margin:0 auto;
    }
    h1{
        /* 字体居中 */
        text-align: center;
        /* 表白墙和p标签之间有一定距离 */
        margin-bottom: 40px;
    }
    p{
        /* 居中 */
        text-align: center;
        color:gray;
        /* 设置行高，调整到看起来舒服的数值 */
        line-height: 63px;
    }
    /* 选中父级元素，设置居中效果 */
    .div1{
        display: flex;
        justify-content: center;
        align-items: center ;
    }
    .edit{
        margin-bottom: 20px;
        width: 200px;
        height: 30px;
    }
    span{
        width: 50px;
        /* 加上下边距 */
        margin-bottom: 20px;
    }
    .submit{
        /* 调整按钮颜色 */
        background-color: rgb(255, 157, 0);
        color:white;
        /* 调整按钮大小 */
        width:260px;
        height: 30px;
        /* 去掉边框 */
        border: none;
        /* 设置圆角，为了更好看 */
        border-radius: 5px;
    }
    /* 设计按钮点击时的动画 */
    .submit:active{
        background-color: gray;
    }
</style>
<script>
    function Submit(){
        let edits = document.querySelectorAll('.edit')
        //打印信息
        console.dir(edits)
        let from = edits[0].value
        let to = edits[1].value
        let message = edits[2].value
        console.log(from + " " + to + " " + message)
        // 创建一个div
        let div = document.createElement('div')
        div.className = "div1"
        div.innerHTML = from + "对：" + to + "，说："+message
        console.log(div)
        let container = document.querySelector('.container')
        // 插入
        container.appendChild(div)
    }
</script>
</html>
