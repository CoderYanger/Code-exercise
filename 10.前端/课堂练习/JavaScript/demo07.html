    let input = document.querySelector('input')
    input.onkeydown = function(event){
        //如果按键按下的是 shift,就弹出一个弹窗，提示 shift 被按下
        if(event.shiftKey){
            alert("shift键被按下")
        }
        //如果按键按下的是 alt,就弹出一个弹窗，提示 alt 被按下
        if(event.altKey){
            alert("alt键被按下")
        }
    }

    let img = document.querySelector('img')
    //dir 可以获取到当前对象的所有属性
    console.dir(img)
